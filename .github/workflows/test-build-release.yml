name: Build and Release Godot Game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GODOT_VERSION: "4.5-beta1"
  GODOT_VERSION_ALT: "4.5.beta1"
  GODOT_BASE_URL: "https://github.com/godotengine/godot-builds/releases/download"

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: Windows-x86_64
            os: windows-latest
            godot_binary_suffix: "_win64.exe"
            godot_archive_suffix: "_win64.exe.zip"
            template_path: "${APPDATA}/Godot/export_templates/"
            export_name: game.exe
            artifact_name: windows-build-x64_64
            needs_sleep: true
            extra_args: "--no-window --verbose"

          - platform: Linux-x86_64
            os: ubuntu-latest
            godot_binary_suffix: "_linux.x86_64"
            godot_archive_suffix: "_linux.x86_64.zip"
            template_path: "${HOME}/.local/share/godot/export_templates/"
            export_name: game.x86_64
            artifact_name: linux-build-x64_64
            needs_sleep: false
            extra_args: ""

          - platform: macOS
            os: macos-latest
            godot_binary: "Godot.app/Contents/MacOS/Godot"
            godot_archive_suffix: "_macos.universal.zip"
            template_path: "/Users/runner/Library/Application Support/Godot/export_templates/"
            export_name: game.dmg
            artifact_name: macos-build
            needs_sleep: false
            extra_args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Cache Godot and Templates
        uses: actions/cache@v5
        with:
          path: |
            godot
            ${{ matrix.template_path }}${{ env.GODOT_VERSION_ALT }}
          key: ${{ matrix.platform }}-godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        shell: bash
        run: |
          GODOT_BINARY="Godot_v${GODOT_VERSION}${{ matrix.godot_binary_suffix }}"
          if [ ! -f "godot/$GODOT_BINARY" ]; then
            curl -L -o godot.zip "${GODOT_BASE_URL}/${GODOT_VERSION}/Godot_v${GODOT_VERSION}${{ matrix.godot_archive_suffix }}"
            unzip godot.zip -d godot
          fi
          chmod +x godot/$GODOT_BINARY || true

      - name: Download Export Templates
        shell: bash
        run: |
          TEMPLATE_DIR="${{ matrix.template_path }}${{ env.GODOT_VERSION_ALT }}"
          if [ ! -d "$TEMPLATE_DIR" ]; then
            mkdir -p "$TEMPLATE_DIR"
            curl -L -o templates.zip "${{ env.GODOT_BASE_URL }}/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz"
            unzip templates.zip -d .
            mv templates/* "$TEMPLATE_DIR/"
          fi

      - name: Export project
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "macOS" ]]; then
            GODOT_BINARY="Godot.app/Contents/MacOS/Godot"
          else
            GODOT_BINARY="Godot_v${GODOT_VERSION}${{ matrix.godot_binary_suffix }}"
          fi
          godot/$GODOT_BINARY --headless ${{ matrix.extra_args }} --export-release "${{ matrix.platform }}" ${{ matrix.export_name }}

      - name: Wait for export completion
        if: matrix.needs_sleep
        shell: bash
        run: sleep 120

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.export_name }}

  build-web:
    name: Build for Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Cache Godot and Templates (Web)
        uses: actions/cache@v5
        with:
          path: |
            godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION_ALT }}
          key: web-godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        shell: bash
        run: |
          if [ ! -f "godot/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64" ]; then
            curl -L -o godot.zip "${{ env.GODOT_BASE_URL }}/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip"
            unzip godot.zip -d godot
          fi
          chmod +x godot/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64

      - name: Download Export Templates
        shell: bash
        run: |
          TEMPLATE_DIR=~/.local/share/godot/export_templates/${{ env.GODOT_VERSION_ALT }}
          if [ ! -d "$TEMPLATE_DIR" ]; then
            mkdir -p "$TEMPLATE_DIR"
            curl -L -o templates.zip "${{ env.GODOT_BASE_URL }}/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz"
            unzip templates.zip -d .
            mv templates/* "$TEMPLATE_DIR/"
          fi

      - name: Export project
        shell: bash
        run: |
          mkdir -p build/web
          godot/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --export-release "Web" build/web/index

      - name: Replace variables in exported HTML
        shell: bash
        run: |
          sed -i 's/\$GODOT_PROJECT_NAME/my-rts-game-godot/g' build/web/index.html
          sed -i 's/\$GODOT_SPLASH_COLOR/#242424/g' build/web/index.html
          sed -i 's/\$GODOT_SPLASH_CLASSES/show-image--true fullsize--true use-filter--true/g' build/web/index.html
          sed -i 's/\$GODOT_SPLASH/index.png/g' build/web/index.html
          sed -i 's/\$GODOT_URL/index.js/g' build/web/index.html
          sed -i 's/\$GODOT_CONFIG/{"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":15160112,"index.wasm":47811600},"focusCanvas":true,"gdextensionLibs":[],"serviceWorker":"index.service.worker.js"}/g' build/web/index.html
          sed -i 's/\$GODOT_THREADS_ENABLED/false/g' build/web/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
